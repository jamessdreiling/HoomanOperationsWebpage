<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact: Hooman Operations</title>
<meta name="description" content="Contact Hooman Operations about process automation for your nonprofit or small business.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;800&display=swap">
<link rel="icon" type="image/svg+xml" href="assets/hooman-mark.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Hooman Operations home">
      <span class="brand-name"><img class="brand-lockup" src="assets/hooman-lockup.png" width="150" height="33" alt="Hooman"><span>OPERATIONS</span></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
      <a class="btn btn-primary" href="https://hoomanoperationsscheduling.as.me">Book now</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Contact us</h1>
      <p class="lede">Interested in working together? Fill out some info and we will be in touch shortly.</p>
      <p>Email: <a href="mailto:jamesd@hoomanoperations.com">jamesd@hoomanoperations.com</a><br>Phone: <a href="tel:+19094141775">(909) 414-1775</a></p>
      <form action="https://formspree.io/f/mvkkzply" method="POST">
        <p hidden><label>Leave this empty<input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label></p>
        <div class="two-col" style="gap: 16px;">
          <label>First name (required)
            <input type="text" name="first_name" required autocomplete="given-name">
          </label>
          <label>Last name (required)
            <input type="text" name="last_name" required autocomplete="family-name">
          </label>
        </div>
        <label>Email (required)
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label>Message (required)
          <textarea name="message" rows="6" required></textarea>
        </label>
        <div>
          <button class="btn btn-primary" type="submit" style="border: 0; cursor: pointer;">Send</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <img class="footer-lockup" src="assets/hooman-lockup.png" width="160" height="35" alt="Hooman Operations">
    <p>&copy; 2026 Hooman Operations LLC. Claremont, CA.</p>
  </footer>
</div>
</body>
</html>
